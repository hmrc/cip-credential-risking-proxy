include "backend.conf"

appName = cip-credential-risking-proxy

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.cipcredentialriskingproxy.Module"


play.i18n.langs = ["en"]
play.http.router = prod.Routes

microservice {
  services {

    access-control {
      request.formUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=PPdSrBr9mkqOekokjzE54cRTj_GCzpRJqsT4amG0JK1UMkpBS1NUVDhWR041NjJWU0lCMVZUNk5NTi4u"
      enabled = "true"
      allow-list = [
        "test-only",
        "cip-credential-risking-proxy"

      ]
    }

    cip-credential-risking {
      host = "localhost"
      port = 9133
    }
  }
}

auditing {
    enabled = true
}

